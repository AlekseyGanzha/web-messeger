services:
  - type: web
    name: web-messager-api
    runtime: node
    plan: free
    region: frankfurt
    healthCheckPath: /health
    buildCommand: npm ci --include=dev && npm run db:generate -w server && npm run build -w shared && npm run build -w server
    startCommand: npx --no-install prisma migrate deploy --schema server/prisma/schema.prisma && node server/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://web-messager-web.onrender.com

  - type: web
    name: web-messager-web
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build -w shared && npm run build -w client
    startCommand: npm run start -w client
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NEXT_PUBLIC_API_URL
        value: https://web-messager-api.onrender.com/api
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://web-messager-api.onrender.com
