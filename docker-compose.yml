services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: web_messager
      POSTGRES_PASSWORD: web_messager
      POSTGRES_DB: web_messager
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web_messager -d web_messager"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      target: server
    environment:
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      DATABASE_URL: postgresql://web_messager:web_messager@db:5432/web_messager?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      RUN_MIGRATIONS: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - uploads:/app/server/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    build:
      context: .
      target: client
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3001}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  db-data:
  uploads:
